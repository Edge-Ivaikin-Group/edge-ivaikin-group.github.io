<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <title>Edge link preview</title>
  <style>
    :root {
      --bg: #05060a;
      --fg: #e8ecf4;
      --muted: #c5cedd;
      --accent: #79e6f2;
      --domain: #a9b1c6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: var(--bg);
    }
    body {
      font-family: "Edge OG Sans", Inter, "Noto Sans", "Noto Naskh Arabic", "WenQuanYi Micro Hei", sans-serif;
      color: var(--fg);
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(380px 320px at 0% 50%, rgba(0, 229, 255, .20), transparent 72%),
        radial-gradient(380px 340px at 100% 58%, rgba(168, 85, 247, .18), transparent 74%),
        var(--bg);
    }
    .safe {
      width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      display: block;
      height: 48px;
      width: auto;
    }
    h1 {
      margin: 20px 0 0;
      max-width: 520px;
      font-size: 52px;
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    .proof {
      margin: 16px 0 0;
      max-width: 520px;
      font-size: 26px;
      line-height: 1.3;
      font-weight: 500;
      color: var(--muted);
    }
    .dot { color: var(--accent); }
    .domain {
      margin: 18px 0 0;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--domain);
    }
    html[dir="rtl"] h1,
    html[dir="rtl"] .proof { letter-spacing: 0; }
    html[lang="zh"] h1 { letter-spacing: 0; line-height: 1.22; }
    html[lang="ar"] h1 { line-height: 1.28; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="safe" id="safe">
      <img class="logo" src="../brand/edge-logo-gold-header.svg" alt="">
      <h1 id="headline"></h1>
      <p class="proof" id="proof"></p>
      <p class="domain">edgeivaikin.com</p>
    </div>
  </div>
</body>
</html>
